name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          GITHUB_PAGES: 'true'

      - name: Prepare project-site artifact
        run: |
          mkdir -p dist/pages
          cp -R dist/client/Cooking_Starter/_next dist/pages/_next
          cp dist/client/index.html dist/pages/index.html
          cp dist/client/index.rsc dist/pages/index.rsc
          cp dist/client/index.html dist/pages/404.html
          cp dist/client/favicon.svg dist/pages/favicon.svg
          cp dist/client/kitchen-workspace.png dist/pages/kitchen-workspace.png
          cp -R dist/client/recipes dist/pages/recipes

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
